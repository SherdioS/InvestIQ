apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: investiq
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
    spec:
      containers:
        - name: app
          image: sherwinrf/investiq-frontend:init
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          # readinessProbe:
          #   httpGet:
          #     path: /health
          #     port: http
          # livenessProbe:
          #   httpGet:
          #     path: /health
          #     port: http
---
