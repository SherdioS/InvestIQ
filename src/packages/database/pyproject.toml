[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investiq-database"
version = "0.1.0"
description = "Database utilities for the InvestIQ Platform."
requires-python = ">=3.12"
dependencies = [
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.1.1",
    "SQLAlchemy==2.0.50",
]

[tool.setuptools]
packages = ["database"]
package-dir = { database = "." }
